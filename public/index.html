<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小组抽签加分</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", 微软雅黑, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .container {
            text-align: center;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px 20px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .call-area {
            margin: 40px 0;
            padding: 30px;
            border: 2px dashed #3498db;
            border-radius: 12px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .call-text {
            font-size: 1.8rem;
            color: #666;
            margin-bottom: 20px;
        }

        .student-name {
            font-size: 3.5rem;
            font-weight: bold;
            color: #e74c3c;
            margin: 20px 0;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
        }

        .btn-start {
            background-color: #3498db;
            color: white;
        }

        .btn-start:hover {
            background-color: #2980b9;
        }

        .btn-stop {
            background-color: #e74c3c;
            color: white;
        }

        .btn-stop:hover {
            background-color: #c0392b;
        }

        .btn-add {
            background-color: #2ecc71;
            color: white;
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.3rem;
        }

        .btn-add:hover {
            background-color: #27ae60;
        }

        .btn-rank {
            background-color: #f39c12;
            color: white;
            margin: 30px 0;
        }

        .btn-rank:hover {
            background-color: #d35400;
        }

        .btn-vote {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 10px 0 30px;
            padding: 16px 48px;
            font-size: 1.4rem;
            border: none;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-vote:hover {
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
            transform: translateY(-2px);
        }

        .rank-area {
            margin-top: 40px;
            display: none;
        }

        .rank-title {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .score-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .score-item {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 12px 20px;
            min-width: 120px;
            text-align: center;
        }

        .student-label {
            font-size: 1rem;
            color: #666;
            margin-bottom: 5px;
        }

        .student-score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e74c3c;
        }

        @media (max-width: 768px) {
            .student-name {
                font-size: 2.5rem;
            }

            .btn {
                margin: 5px 0;
                width: 80%;
            }

            .score-list {
                flex-direction: column;
                align-items: center;
            }

            .score-item {
                width: 90%;
            }
        }
        .admin-entry {
            position: fixed;
            bottom: 12px;
            right: 16px;
            font-size: 18px;
            color: #ccc;
            opacity: 0.18;
            text-decoration: none;
            z-index: 999;
            transition: opacity 0.2s;
        }
        .admin-entry:hover { opacity: 0.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>小组抽签加分</h1>

        <div class="call-area">
            <div class="call-text" id="callText">点击下方按钮开始随机点名</div>
            <div class="student-name" id="studentName">——</div>
            <div>
                <button class="btn btn-start" id="startBtn">开始随机点名</button>
                <button class="btn btn-stop" id="stopBtn" disabled>停止点名</button>
            </div>
            <button class="btn btn-add" id="addScoreBtn" disabled>+1分</button>
        </div>

        <button class="btn btn-rank" id="rankBtn">查看全班加分排行</button>

        <!-- 进入投票 -->
        <div style="margin-top:20px;">
            <a href="/vote.html" style="text-decoration:none;">
                <button class="btn-vote">进入投票</button>
            </a>
        </div>

        <div class="rank-area" id="rankArea">
            <h2 class="rank-title">全班加分排行（按分数降序）</h2>
            <div class="score-list" id="scoreList"></div>
        </div>
    </div>

    <a href="/admin.html" class="admin-entry" title="设置">⚙</a>

    <script>
        const studentList = [
            '社区画像组', '智慧门禁组', '智能服务组', '信息归仓组'
        ];

        let studentScores = {};
        studentList.forEach(name => {
            studentScores[name] = 0;
        });

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const addScoreBtn = document.getElementById('addScoreBtn');
        const rankBtn = document.getElementById('rankBtn');
        const callText = document.getElementById('callText');
        const studentName = document.getElementById('studentName');
        const rankArea = document.getElementById('rankArea');
        const scoreList = document.getElementById('scoreList');

        let rollInterval = null;
        let isRolling = false;
        let currentStudent = '';

        startBtn.addEventListener('click', () => {
            if (isRolling) return;
            isRolling = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            callText.textContent = '正在随机抽取...';
            studentName.style.color = '#3498db';

            rollInterval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * studentList.length);
                currentStudent = studentList[randomIndex];
                studentName.textContent = currentStudent;
            }, 100);
        });

        stopBtn.addEventListener('click', () => {
            clearInterval(rollInterval);
            isRolling = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            addScoreBtn.disabled = false;
            callText.textContent = '本次点名结果';
            studentName.style.color = '#e74c3c';
        });

        addScoreBtn.addEventListener('click', () => {
            if (!currentStudent) return;
            studentScores[currentStudent]++;
            addScoreBtn.style.backgroundColor = '#1abc9c';
            setTimeout(() => {
                addScoreBtn.style.backgroundColor = '#27ae60';
            }, 300);
            if (rankArea.style.display === 'block') {
                renderScoreList();
            }
        });

        rankBtn.addEventListener('click', () => {
            if (rankArea.style.display === 'block') {
                rankArea.style.display = 'none';
                rankBtn.textContent = '查看全班加分排行';
            } else {
                rankArea.style.display = 'block';
                rankBtn.textContent = '收起加分排行';
                renderScoreList();
            }
        });

        function renderScoreList() {
            scoreList.innerHTML = '';
            const sortedStudents = Object.entries(studentScores)
                .sort((a, b) => {
                    if (b[1] !== a[1]) {
                        return b[1] - a[1];
                    } else {
                        return a[0].localeCompare(b[0], 'zh-CN');
                    }
                });
            sortedStudents.forEach(([name, score]) => {
                const scoreItem = document.createElement('div');
                scoreItem.className = 'score-item';
                scoreItem.innerHTML = `
                    <div class="student-label">${name}</div>
                    <div class="student-score">${score}分</div>
                `;
                scoreList.appendChild(scoreItem);
            });
        }
    </script>
</body>
</html>
