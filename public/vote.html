<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>投票</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      color: #333;
    }
    .vote-header {
      text-align: center;
      padding: 30px 20px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
    }
    .vote-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .vote-header p { font-size: 13px; opacity: 0.85; line-height: 1.5; }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      font-size: 13px;
      color: #666;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.voting { background: #52c41a; box-shadow: 0 0 6px #52c41a; animation: pulse 1.5s infinite; }
    .status-dot.pending { background: #faad14; }
    .status-dot.paused { background: #faad14; }
    .status-dot.ended { background: #ff4d4f; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .vote-list { padding: 10px 16px 30px; display: flex; flex-direction: column; gap: 12px; }
    .vote-card {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      gap: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: all 0.3s;
      position: relative;
      border: 2px solid transparent;
    }
    .vote-card.voted {
      border-color: #52c41a;
      background: #f6ffed;
    }
    .card-avatar {
      width: 68px; height: 68px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      background: #f0f5ff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .card-avatar .placeholder { font-size: 28px; }
    .card-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .card-info h3 { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
    .card-info p { font-size: 13px; color: #999; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-action { display: flex; align-items: center; flex-shrink: 0; }
    .btn-vote {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .btn-vote:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
    .btn-vote:disabled { background: #d9d9d9; color: #999; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-vote.voted-btn { background: linear-gradient(135deg, #52c41a, #389e0d); }
    .rank-badge {
      position: absolute;
      top: 8px; right: 10px;
      background: #f0f5ff;
      color: #667eea;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: #fff;
      border-radius: 16px;
      padding: 30px 40px;
      text-align: center;
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .toast .icon { font-size: 48px; margin-bottom: 12px; }
    .toast .msg { font-size: 16px; color: #333; font-weight: 500; }
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    .empty-state { text-align: center; padding: 60px 20px; color: #999; }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .loading { text-align: center; padding: 60px 20px; color: #667eea; }
    .loading .spinner {
      width: 36px; height: 36px;
      border: 3px solid #f0f0f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .admin-entry {
      position: fixed;
      bottom: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #ccc;
      opacity: 0.25;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.3s;
      text-decoration: none;
    }
    .admin-entry:hover { opacity: 0.6; }
  </style>
</head>
<body>
  <div class="vote-header">
    <h1 id="activityName">投票活动</h1>
    <p id="activityDesc">加载中...</p>
  </div>
  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">加载中...</span>
  </div>
  <div id="voteContent" class="vote-list">
    <div class="loading"><div class="spinner"></div><div>正在加载...</div></div>
  </div>
  <a href="/admin.html" class="admin-entry" title="设置">⚙</a>
  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast">
    <div class="icon" id="toastIcon">✅</div>
    <div class="msg" id="toastMsg">投票成功</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const API = '/api';
    let currentActivity = null;
    let voterUuid = '';
    let hasVoted = false;
    let votedGroupId = null;

    function getUuid() {
      let uuid = localStorage.getItem('voter_uuid');
      if (!uuid) {
        uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0;
          return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
        localStorage.setItem('voter_uuid', uuid);
      }
      return uuid;
    }

    function showToast(msg, icon = '✅', duration = 2000) {
      document.getElementById('toastIcon').textContent = icon;
      document.getElementById('toastMsg').textContent = msg;
      document.getElementById('toast').classList.add('show');
      document.getElementById('overlay').classList.add('show');
      setTimeout(() => {
        document.getElementById('toast').classList.remove('show');
        document.getElementById('overlay').classList.remove('show');
      }, duration);
    }

    const statusMap = {
      pending: { text: '投票尚未开始', class: 'pending' },
      voting: { text: '投票进行中', class: 'voting' },
      paused: { text: '投票已暂停', class: 'paused' },
      ended: { text: '投票已结束', class: 'ended' }
    };

    async function loadActivity() {
      try {
        const res = await fetch(`${API}/activity`);
        const json = await res.json();
        if (json.code !== 0 || !json.data) {
          document.getElementById('voteContent').innerHTML =
            '<div class="empty-state"><div class="icon">📭</div><div>暂无投票活动</div></div>';
          return;
        }
        currentActivity = json.data.activity;
        const groups = json.data.groups;
        document.getElementById('activityName').textContent = currentActivity.name;
        document.getElementById('activityDesc').textContent = currentActivity.description || '';
        const statusInfo = statusMap[currentActivity.status] || statusMap.pending;
        document.getElementById('statusDot').className = 'status-dot ' + statusInfo.class;
        document.getElementById('statusText').textContent = statusInfo.text;
        await checkVoteStatus(currentActivity.id);
        renderGroups(groups);
      } catch (err) {
        document.getElementById('voteContent').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><div>加载失败，请刷新重试</div></div>';
      }
    }

    async function checkVoteStatus(activityId) {
      try {
        const res = await fetch(`${API}/vote/check/${activityId}/${voterUuid}`);
        const json = await res.json();
        if (json.code === 0 && json.data.voted) {
          hasVoted = true;
          votedGroupId = json.data.groupId;
        }
      } catch {}
    }

    function renderGroups(groups) {
      const container = document.getElementById('voteContent');
      if (!groups || groups.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>暂无候选组</div></div>';
        return;
      }
      const canVote = currentActivity.status === 'voting' && !hasVoted;
      container.innerHTML = groups.map((g, i) => `
        <div class="vote-card ${hasVoted && votedGroupId === g.id ? 'voted' : ''}">
          <span class="rank-badge">#${i + 1}</span>
          <div class="card-avatar">
            ${g.image ? `<img src="${g.image}" alt="${g.name}">` : `<span class="placeholder">🎤</span>`}
          </div>
          <div class="card-info">
            <h3>${g.name}</h3>
            <p>${g.description || ''}</p>
          </div>
          <div class="card-action">
            ${hasVoted && votedGroupId === g.id
              ? '<button class="btn-vote voted-btn" disabled>已投 ✓</button>'
              : hasVoted
                ? '<button class="btn-vote" disabled>已投票</button>'
                : `<button class="btn-vote" onclick="submitVote(${g.id})" ${!canVote ? 'disabled' : ''}>投票</button>`}
          </div>
        </div>
      `).join('');
    }

    async function submitVote(groupId) {
      if (hasVoted) return showToast('您已经投过票', '⚠️');
      if (!currentActivity || currentActivity.status !== 'voting') return showToast('当前不在投票阶段', '⚠️');
      try {
        const res = await fetch(`${API}/vote`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ activityId: currentActivity.id, groupId, voterUuid })
        });
        const json = await res.json();
        if (json.code === 0) {
          hasVoted = true;
          votedGroupId = groupId;
          showToast('投票成功！', '🎉');
          setTimeout(() => loadActivity(), 1000);
        } else {
          showToast(json.message || '投票失败', '❌');
        }
      } catch { showToast('网络错误，请重试', '❌'); }
    }

    const socket = io();
    socket.on('statusChange', (data) => { if (currentActivity && data.activityId === currentActivity.id) loadActivity(); });
    socket.on('voteReset', (data) => { if (currentActivity && data.activityId === currentActivity.id) { hasVoted = false; votedGroupId = null; loadActivity(); } });

    voterUuid = getUuid();
    fetch(`${API}/log/access`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page: 'vote', voterUuid })
    }).catch(() => {});
    loadActivity();
  </script>
</body>
</html>
